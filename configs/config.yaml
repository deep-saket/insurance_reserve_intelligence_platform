project_name: src
experiment_name: actuary_twin_term_life_pinn
seed: 42

paths:
  artifacts_dir: artifacts
  checkpoints_dir: artifacts/checkpoints
  logs_dir: artifacts/logs
  reports_dir: artifacts/reports
  plots_dir: artifacts/plots
  tensorboard_dir: artifacts/tensorboard
  data_dir: data

data:
  train_size: 1000
  validation_size: 200
  test_size: 200
  time_steps: 48
  batch_size: 64
  num_workers: 0
  age_min: 25
  age_max: 70
  term_min: 5
  term_max: 30
  interest_rate_min: 0.01
  interest_rate_max: 0.08
  sum_assured_min: 50000.0
  sum_assured_max: 1000000.0
  mortality_scale: 0.00045
  mortality_shape: 1.085
  mortality_reference_age: 25
  premium_loading: 1.10
  max_expiry_age: 80
  sum_assured_rounding: 50000.0
  sum_assured_age_decay: 0.02
  random_seed: 42

solver:
  method: solve_ivp
  integration_step: 0.25
  rtol: 1.0e-6
  atol: 1.0e-8

model:
  input_dim: 7
  hidden_dim: 256
  num_layers: 6
  activation: tanh
  dropout: 0.0   # disable: dropout kills small physics gradients (dV/dP, dV/dS)
  skip_connections: true   # improves gradient flow for sensitivity learning

losses:
  data_loss:
    enabled: true
    weight: 4.0   # keep data fit dominant in early training

  pde_loss:
    enabled: true
    weight: 0.2   # corrected z-space PDE residual is stronger; keep it secondary to fit

  boundary_loss:
    enabled: true
    weight: 0.01  # boundary raw loss is large in z-space; small weight is sufficient

  mortality_monotonicity_loss:
    enabled: true
    weight: 0.005
    
  age_monotonicity_loss:
    enabled: false
    weight: 1.0

  interest_rate_monotonicity_loss:
    enabled: true
    weight: 5.0

  interest_rate_scenario_loss:
    enabled: true
    weight: 25000.0

  interest_rate_peak_loss:
    enabled: true
    weight: 30000.0  # peak reserve-ratio targets are tiny; use a large weight to make the signal matter

  solvency_loss:
    enabled: true
    weight: 0.1

  reserve_ceiling_loss:
    enabled: true
    weight: 0.05

  smoothness_loss:
    enabled: true
    weight: 0.01

  portfolio_consistency_loss:
    enabled: false
    weight: 0.5

  l2_regularization_loss:
    enabled: true
    weight: 1.0e-6

  sum_assured_monotonicity_loss:
    enabled: true
    weight: 0.0001

loss_settings:
  reduction: mean
  use_adaptive_weights: false

trainer:
  run_name: run_23
  epochs: 100
  learning_rate: 0.0002
  weight_decay: 5.0e-5
  gradient_clip_norm: 0.5
  early_stopping_patience: 45
  scheduler_patience: 10
  scheduler_factor: 0.5
  checkpoint_every: 5
  resume_from: 
  device: auto
  tensorboard_enabled: true
  mixed_precision: false   # fp16 AMP overflows on large reserve/sum_assured magnitudes → NaN

stress:
  mortality_shock: 0.15
  interest_rate_shock: -0.01
  inflation_shock: 0.05
  longevity_shock: -0.10
  lapse_shock: 0.10

optimization:
  learning_rate: 0.005
  steps: 100
  reserve_tolerance: 1.0e-4
  solvency_threshold: 0.0

digital_twin:
  forecast_horizon: 30
  scenario_steps: 12
  regime_names:
    - base
    - soft_recession
    - inflationary
    - mortality_crisis
